[workspace]
resolver = "2"
members = [
    "xtask",
    "spikes/aster-ui-model",
    "spikes/file-manager-slint",
    "benchmarks/apps/B1-minimal",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
