[package]
name = "file-manager-aster"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "file-manager-aster"
path = "src/main.rs"

[dependencies]
aster-ui-model = { path = "../aster-ui-model" }
aster-backend-slint = { path = "../aster-backend-slint" }
file-manager-core = { path = "../file-manager-core" }
serde_json = "1"
slint = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
