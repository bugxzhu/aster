[package]
name = "file-manager-slint"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "file-manager-slint"
path = "src/main.rs"

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
slint-build = "1"
